<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ናቲ ቢንጎ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12343b">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#12343b;--bg:#e6f4f1;--card:#fff;--B:#e63946;--I:#f4a261;--N:#2a9d8f;--G:#457b9d;--O:#8e5bb5;--mark:#12343b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Ethiopic",sans-serif;background:var(--bg);color:var(--ink);padding:14px}
main{max-width:460px;margin:0 auto}
.brand{text-align:center;font-size:1.15rem;font-weight:800;color:var(--G);margin-top:2px}
h1{margin:0 0 10px;font-size:1.8rem;text-align:center;letter-spacing:2px}
h1 b:nth-child(1){color:var(--B)}h1 b:nth-child(2){color:var(--I)}h1 b:nth-child(3){color:var(--N)}h1 b:nth-child(4){color:var(--G)}h1 b:nth-child(5){color:var(--O)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:2px solid var(--ink);background:none;border-radius:12px;font-weight:700;font-size:1rem;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
section{display:none}section.on{display:block}
.card{background:var(--card);border-radius:18px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hd{text-align:center;font-weight:900;font-size:1.6rem;color:#fff;border-radius:10px;padding:4px 0}
.cell{aspect-ratio:1;border:2px solid #cfe3df;border-radius:12px;background:#f7fcfb;font-size:1.4rem;font-weight:800;color:var(--ink)}
.cell.on{background:var(--mark);color:#fff;border-color:var(--mark)}
.cell.free{background:var(--I);border-color:var(--I);color:#fff;font-size:.9rem}
.cell.called:not(.on){border-color:var(--N);box-shadow:inset 0 0 0 2px var(--N)}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;font-size:1.05rem;font-weight:800;color:#fff;background:var(--ink)}
.btn.win{background:#1faa59}.btn.alt{background:#c9e2dd;color:var(--ink)}
.msg{min-height:1.5em;margin-top:10px;text-align:center;font-weight:700}
.ball{width:150px;height:150px;border-radius:50%;margin:6px auto 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:#9bb;box-shadow:inset -10px -10px 0 rgba(0,0,0,.15)}
.ball small{font-size:1.4rem;font-weight:800}.ball span{font-size:3.6rem;font-weight:900;line-height:1}
.board{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:14px}
.board i{font-style:normal;text-align:center;font-size:.7rem;padding:4px 0;border-radius:5px;background:#dcebe8;color:#7a9b96}
.board i.on{color:#fff;font-weight:800}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.95rem}
.recent{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.recent span{padding:4px 10px;border-radius:99px;color:#fff;font-weight:800}
</style>
</head>
<body>
<main>
  <div class="brand">ናቲ ቢንጎ</div>
  <h1><b>B</b><b>I</b><b>N</b><b>G</b><b>O</b></h1>
  <div class="tabs">
    <button class="on" data-t="play">የእኔ ካርድ</button>
    <button data-t="call">ቁጥር አውጪ</button>
  </div>

  <section id="play" class="on">
    <div class="card"><div class="grid" id="card"></div></div>
    <div class="msg" id="msg"></div>
    <button class="btn win" id="bingo">ቢንጎ! 🎉</button>
    <button class="btn alt" id="newcard">አዲስ ካርድ</button>
  </section>

  <section id="call">
    <div class="ball" id="ball"><small>ጀምር</small></div>
    <div class="recent" id="recent"></div>
    <button class="btn" id="draw">ቁጥር አውጣ</button>
    <div class="row"><input type="checkbox" id="auto"><label for="auto">በራስ ሰር እያወጣ ቀጥል (ሁሉም 4 ሰከንድ)</label></div>
    <div class="board" id="board"></div>
    <div class="msg" id="count"></div>
    <button class="btn alt" id="reset">ጨዋታ እንደገና ጀምር</button>
  </section>
</main>

<script>
const L = ["B","I","N","G","O"], COL = ["#e63946","#f4a261","#2a9d8f","#457b9d","#8e5bb5"];
const $ = id => document.getElementById(id);
const letterOf = n => L[Math.floor((n-1)/15)];
const colorOf = n => COL[Math.floor((n-1)/15)];
let called = [], card = [], marked = new Set(), timer = null;

// ----- ካርድ -----
function newCard(){
  card = L.map((_,c) => {
    const pool = Array.from({length:15}, (_,i)=> c*15+i+1);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    return pool.slice(0,5);
  });
  card[2][2] = 0; // ነጻ ቦታ
  marked = new Set(); $("msg").textContent = "";
  drawCard();
}
function drawCard(){
  let h = L.map((l,i)=>`<div class="hd" style="background:${COL[i]}">${l}</div>`).join("");
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){
    const n = card[c][r], free = n===0;
    const cls = ["cell", free?"free on":"", marked.has(n)?"on":"", called.includes(n)?"called":""].join(" ");
    h += `<button class="${cls}" data-n="${n}" ${free?"disabled":""}>${free?"ነጻ":n}</button>`;
  }
  $("card").innerHTML = h;
}
$("card").onclick = e => {
  const b = e.target.closest(".cell"); if(!b) return;
  const n = +b.dataset.n;
  marked.has(n) ? marked.delete(n) : marked.add(n);
  drawCard();
};
function hasLine(){
  const ok = (c,r) => card[c][r]===0 || (marked.has(card[c][r]) && called.includes(card[c][r]));
  for(let i=0;i<5;i++){
    if([0,1,2,3,4].every(j=>ok(j,i))) return true;   // ረድፍ
    if([0,1,2,3,4].every(j=>ok(i,j))) return true;   // አምድ
  }
  return [0,1,2,3,4].every(i=>ok(i,i)) || [0,1,2,3,4].every(i=>ok(i,4-i)); // ሰያፍ
}
$("bingo").onclick = () => {
  if(hasLine()){ $("msg").textContent = "🎉 ቢንጎ! አሸንፈሃል! ሁሉም ምልክቶች ከወጡ ቁጥሮች ጋር ተረጋግጠዋል።"; }
  else { $("msg").textContent = "ገና ቢንጎ አይደለም። ሙሉ መስመር ያስፈልጋል፤ ምልክት ያደረግከው ቁጥር ደግሞ መውጣት አለበት።"; }
};
$("newcard").onclick = newCard;

// ----- ቁጥር አውጪ -----
function buildBoard(){
  $("board").innerHTML = Array.from({length:75},(_,i)=>{
    const n=i+1, on=called.includes(n);
    return `<i class="${on?"on":""}" style="${on?"background:"+colorOf(n):""}">${n}</i>`;
  }).join("");
  $("count").textContent = called.length ? `የወጡ፦ ${called.length} / 75` : "";
  $("recent").innerHTML = called.slice(-5).reverse().map(n=>`<span style="background:${colorOf(n)}">${letterOf(n)}${n}</span>`).join("");
}
function draw(){
  if(called.length>=75){ stopAuto(); $("ball").innerHTML="<small>አልቋል</small>"; return; }
  let n; do{ n = Math.floor(Math.random()*75)+1; }while(called.includes(n));
  called.push(n);
  const b = $("ball"); b.style.background = colorOf(n);
  b.innerHTML = `<small>${letterOf(n)}</small><span>${n}</span>`;
  if("speechSynthesis" in window){ try{ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(letterOf(n)+" "+n)); }catch(e){} }
  buildBoard(); drawCard();
}
function stopAuto(){ clearInterval(timer); timer=null; $("auto").checked=false; }
$("draw").onclick = draw;
$("auto").onchange = e => { if(e.target.checked){ draw(); timer=setInterval(draw,4000); } else stopAuto(); };
$("reset").onclick = () => { stopAuto(); called=[]; $("ball").style.background="#9bb"; $("ball").innerHTML="<small>ጀምር</small>"; buildBoard(); newCard(); };

document.querySelector(".tabs").onclick = e => {
  const t = e.target.dataset.t; if(!t) return;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===e.target));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===t));
};
newCard(); buildBoard();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
